# GLM-Hourness bundle patch (DSH Loader dialect). Rows are independent:
# disable any line and the session degrades gracefully (fail-open).
# The channel rows keep the credential in the user-level directory
# $DSH_HOME/glm-hourness (default ~/.dsh; docs/DESIGN.md §2.4). The data row
# defaults its project directory to this repository's `.llm`
# (USERPROFILE-relative); the user's profile patch overrides per row (it sets
# `home` for memory, workflow and hourness).
- insert:
    - id: glm-hourness/glm-llm
      # Native ZCode channel: /glm-login fills the encrypted credential store;
      # a missing credential fails the stream with the re-login instruction.
      # Ships disabled until the sandbox (docs/DEVELOPMENT.md §3) passes: an
      # unverified adapter row must never activate on the user's next restart.
      name: ./dist/glm-llm/index.js
      disabled: true
      inject: [llm]
      config: {}
    - id: glm-hourness/glm-login
      name: ./dist/glm-llm/login-row.js
      inject: [commands]
      config: {}
    - id: glm-hourness/glm-prompt
      name: ./dist/glm-prompt/index.js
      config: {}
    - id: glm-hourness/glm-compact
      name: ./dist/glm-prompt/compact-row.js
      config: {}
    - id: glm-hourness/data
      # Data directory service (docs/DESIGN.md §2.4): the user-level
      # directory resolves to $DSH_HOME/glm-hourness (default ~/.dsh); the
      # project directory is the workspace `.llm`. Guard, memory, workflow
      # and hourness read it lazily and keep working without it.
      name: ./dist/data/index.js
      config:
        projectHome: !!js "process.env.USERPROFILE + '/Desktop/Project/GLM-Hourness/.llm'"
    - id: glm-hourness/guard
      name: ./dist/guard/index.js
      config: {}
    - id: glm-hourness/memory
      name: ./dist/memory/index.js
      inject: [tools]
      config: {}
    - id: glm-hourness/workflow
      name: ./dist/workflow/index.js
      config: {}
    - id: glm-hourness/hourness
      name: ./dist/ui/index.js
      inject: [commands]
      config: {}
    - id: glm-hourness/graph
      # Project graph tools (docs/ORCHESTRATION.md §2.10): the engine's read
      # and write operations with actor llm, the per-step projection of the
      # focus node an agent sets with graph_focus (§2.5), and the guard rule
      # graph-files-only that denies direct writes into the graph (§2.7),
      # decided before the guard row's rules. The graph is
      # docs/graph under the session working directory unless config.dir
      # names another (an absolute path, or one relative to that directory).
      # Ships disabled until the sandbox (docs/DEVELOPMENT.md §3) passes.
      name: ./dist/graph/index.js
      disabled: true
      inject: [tools]
      config: {}
    - id: glm-hourness/graph-panel
      # Write path of the project graph panel (docs/ORCHESTRATION.md §2.10,
      # §13): the /graph-apply command applies one mutation as the human to
      # docs/graph under the invoking session's working directory (or
      # config.dir). Registers nothing model-facing. Enabled after the L3
      # probe (scenario glm-graph-panel) passed on 2026-10-28.
      name: ./dist/graph/panel-row.js
      inject: [commands]
      config: {}
