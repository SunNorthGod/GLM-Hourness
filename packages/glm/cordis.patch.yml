# dsh-glm-zcode bundle patch (DSH Loader dialect): the GLM channel package.
# Rows are independent: disable any line and the session degrades gracefully
# (fail-open). The channel rows keep the credential in the user-level
# directory $DSH_HOME/glm-hourness (default ~/.dsh; docs/DESIGN.md §2.4).
# Row ids stay `glm-hourness/<row>` across the split: profile overrides
# match by id (docs/DESIGN.md §2.3).
# Rows are named through this package (docs/DESIGN.md §2.3): a host row by
# its export `dsh-glm-zcode/<row>`, whose settings-page title is
# locale/<row>/; the client row by the exact package name. A path name
# would show as its file URL in Settings and would count as a second source
# of the package's client face.
- insert:
    - id: glm-hourness/glm-llm
      # Native ZCode channel: /glm-login fills the encrypted credential store;
      # a missing credential fails the stream with the re-login instruction.
      # Ships disabled until the sandbox (docs/DEVELOPMENT.md §3) passes: an
      # unverified adapter row must never activate on the user's next restart.
      name: dsh-glm-zcode/glm-llm
      disabled: true
      inject: [llm]
      config: {}
    - id: glm-hourness/glm-login
      name: dsh-glm-zcode/glm-login
      inject: [commands]
      config: {}
    - id: glm-hourness/glm-prompt
      name: dsh-glm-zcode/glm-prompt
      config: {}
    - id: glm-hourness/glm-compact
      name: dsh-glm-zcode/glm-compact
      config: {}
    - id: glm-hourness/glm-ui
      # The package's client face (dsh.client in package.json, host half
      # ./ui/index.js, bundle ./ui/client.js): the GLM pill under the
      # composer and the settings section. Exactly one row: client-modules
      # counts a row named by the exact package name as a source of its
      # client face and rejects a package resolved from multiple active
      # Loader sources. Enabled after round 1 of the split desktop check
      # passed (AGENTS.md rule 4).
      name: dsh-glm-zcode
      config: {}
