# dsh-hourness bundle patch (DSH Loader dialect): the orchestration package,
# for any model. Rows are independent: disable any line and the session
# degrades gracefully (fail-open). The data row defaults its project
# directory to this repository's `.llm` (USERPROFILE-relative); the user's
# profile patch overrides per row (it sets `home` for memory, workflow and
# hourness). Row ids stay `glm-hourness/<row>` across the split: profile
# overrides match by id (docs/DESIGN.md §2.3).
# Rows are named through this package (docs/DESIGN.md §2.3): a host row by
# its export `dsh-hourness/<row>`, whose settings-page title is
# locale/<row>/; the client row by the exact package name. A path name
# would show as its file URL in Settings and would count as a second source
# of the package's client face.
- insert:
    - id: glm-hourness/data
      # Data directory service (docs/DESIGN.md §2.4): the user-level
      # directory resolves to $DSH_HOME/glm-hourness (default ~/.dsh); the
      # project directory is the workspace `.llm`. Guard, memory, workflow
      # and hourness read it lazily and keep working without it.
      name: dsh-hourness/data
      config:
        projectHome: !!js "process.env.USERPROFILE + '/Desktop/Project/GLM-Hourness/.llm'"
    - id: glm-hourness/guard
      name: dsh-hourness/guard
      config: {}
    - id: glm-hourness/memory
      name: dsh-hourness/memory
      inject: [tools]
      config: {}
    - id: glm-hourness/workflow
      name: dsh-hourness/workflow
      config: {}
    - id: glm-hourness/hourness
      name: dsh-hourness/hourness
      inject: [commands]
      config: {}
    - id: glm-hourness/graph
      # Project graph tools (docs/ORCHESTRATION.md §2.10): the engine's read
      # and write operations with actor llm, the per-step projection of the
      # focus node an agent sets with graph_focus (§2.5), and the guard rule
      # graph-files-only that denies direct writes into the graph (§2.7),
      # decided before the guard row's rules and journaled in the violation
      # journal. The graph is docs/graph under the session working directory
      # unless config.dir names another (an absolute path, or one relative to
      # that directory). Enabled after the L3 probe (scenarios glm-graph,
      # non-glm-graph, glm-graph-compact, glm-graph-goal) passed on
      # 2026-10-28.
      name: dsh-hourness/graph
      inject: [tools]
      config: {}
    - id: glm-hourness/graph-panel
      # Write path of the project graph panel (docs/ORCHESTRATION.md §2.10,
      # §13): the /graph-apply command applies one mutation as the human to
      # docs/graph under the invoking session's working directory (or
      # config.dir). Registers nothing model-facing. Enabled after the L3
      # probe (scenario glm-graph-panel) passed on 2026-10-28.
      name: dsh-hourness/graph-panel
      inject: [commands]
      config: {}
    - id: glm-hourness/rules
      # Rules board (docs/ORCHESTRATION.md §16): the rules of each project,
      # kept in the repository (docs/rules/rules.json) and in the project's
      # .llm/rules/, and its peak mode (no effect, do less, do none; the
      # factory default is do less). The row judges every tool call after the
      # gates inside it (a rule that blocks refuses the call, a rule that
      # records leaves a line in the violation journal), keeps its own files
      # to itself (rules:files-only), gives agents the tool rules_show, and
      # gives the person /rules; the peak mode is handed to the rows that read
      # it through the glmHournessPeakMode service. A rule of the person that
      # queues refuses the call once with a waiting ticket, and the agent is
      # told when it clears. At the stop level of the peak mode a GLM
      # subagent's tool calls are one ticket for its session and its active goal
      # is paused until the peak is over; dispatching a GLM subagent waits the
      # same way. Holds no main agent and pauses none of its goals. Ships disabled
      # until the L3 probe (scenarios glm-rules, non-glm-rules, rules-queue,
      # rules-handover, rules-peak, rules-peak-stop) and the first desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md).
      name: dsh-hourness/rules
      disabled: true
      inject: [tools, commands]
      config: {}
    - id: glm-hourness/design
      # Main agent mode (docs/ORCHESTRATION.md §3.1, §3.5): /wish makes one
      # session per project the main agent, the person's one conversation with
      # the project. From the next step on that session's system prompt carries
      # the identity section, its tool face has no file-writing tool and no
      # ask_user_question, and its role is kept in a session projection and in
      # a holder record under the DSH user directory (one main agent per
      # project). Ships disabled until the L3 probe scenarios
      # (glm-design-wish-idle, non-glm-design-wish-idle, glm-design-main,
      # non-glm-design-main, glm-design-one-main) and the batch desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md).
      name: dsh-hourness/design
      disabled: true
      inject: [commands]
      config: {}
    - id: glm-hourness/loops
      # Loop board (docs/ORCHESTRATION.md §18): what is done when something
      # happens or the time comes. Rows hand their entries, events and harness
      # actions to the service glmHournessLoops; the board validates and lists
      # them, an entry whose event nobody declares waits greyed, and the row
      # brings four entries of its own (dependency check after a merge,
      # a reminder for what waits for you too long, the two ends of a GLM
      # peak). It keeps the entries a person agreed to (docs/loops/ in the
      # repository, the change record in the project's .llm/loops/), gives the
      # person /loops, keeps its own files to itself (loops:files-only), and in
      # a process that has a session controller it holds the project's run
      # lock, beats every 60 seconds, reads the inbox and runs what an entry
      # says to do. Not here yet: the delivery to the main agent, the binding
      # of DSH schedules, the tools and the pages, and the executor of a script
      # or a check entry (those two end refused). Ships disabled until the L3
      # probe and the first desktop pass (docs/DEVELOPMENT.md §3, AGENTS.md).
      name: dsh-hourness/loops
      disabled: true
      config: {}
    - id: glm-hourness/ui
      # The package's client face (dsh.client in package.json, host half
      # ./ui/index.js, bundle ./ui/client.js): the project graph tab of the
      # right sidebar. Exactly one row: client-modules counts a row named by
      # the exact package name as a source of its client face and rejects a
      # package resolved from multiple active Loader sources. Keeps the id of
      # the single-bundle UI row, which was enabled.
      name: dsh-hourness
      config: {}
