# dsh-hourness bundle patch (DSH Loader dialect): the orchestration package,
# for any model. Rows are independent: disable any line and the session
# degrades gracefully (fail-open). The data row defaults its project
# directory to this repository's `.llm` (USERPROFILE-relative); the user's
# profile patch overrides per row (it sets `home` for memory, workflow and
# hourness; the memory row ignores `home` since M5: its project directory
# follows the working directory of each session). Row ids stay `glm-hourness/<row>` across the split: profile
# overrides match by id (docs/DESIGN.md §2.3).
# Rows are named through this package (docs/DESIGN.md §2.3): a host row by
# its export `dsh-hourness/<row>`, whose settings-page title is
# locale/<row>/; the client row by the exact package name. A path name
# would show as its file URL in Settings and would count as a second source
# of the package's client face.
- insert:
    - id: glm-hourness/data
      # Data directory service (docs/DESIGN.md §2.4): the user-level
      # directory resolves to $DSH_HOME/glm-hourness (default ~/.dsh); the
      # project directory is the workspace `.llm`. Guard, memory, workflow
      # and hourness read it lazily and keep working without it.
      name: dsh-hourness/data
      config: {}
    - id: glm-hourness/guard
      name: dsh-hourness/guard
      inject: [tools]
      config: {}
    - id: glm-hourness/memory
      # Memory (docs/ORCHESTRATION.md §8): the memory tools, the session-start
      # index, /memory, the learning pipeline, and since 2026-11-11 the nightly
      # consolidation entry memory.dream-nightly on the loop board
      # (src/memory/loop-entry.ts): the person's recurring requests, read out of
      # .llm/transcripts/ deterministically, become memory candidates (propose
      # records) for the person to confirm (memory_store) or drop
      # (memory_forget); recall never shows them before that.
      name: dsh-hourness/memory
      inject: [tools]
      config: {}
    - id: glm-hourness/lessons
      # Lessons board (docs/ORCHESTRATION.md §8.6): the pitfalls and fixes of
      # a project, kept in its .llm/lessons.jsonl. lessons_query for every
      # agent, lessons_merge for the main agent, the service
      # glmHournessLessons for the dispatch of work, notices to the main agent
      # and /lessons. Advice, not rules: blocks nothing. Ships enabled since
      # the lessons enablement (2026-11-06): the L3 probe scenarios
      # (glm-lessons, non-glm-lessons, glm-lessons-failure,
      # non-glm-lessons-failure) passed; the first desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md) is still owed.
      name: dsh-hourness/lessons
      inject: [tools]
      config: {}
    - id: glm-hourness/workflow
      name: dsh-hourness/workflow
      config: {}
    - id: glm-hourness/hourness
      name: dsh-hourness/hourness
      inject: [commands]
      config: {}
    - id: glm-hourness/graph
      # Project graph tools (docs/ORCHESTRATION.md §2.10): the engine's read
      # and write operations with actor llm, the per-step projection of the
      # focus node an agent sets with graph_focus (§2.5), and the guard rule
      # graph-files-only that denies direct writes into the graph (§2.7),
      # decided before the guard row's rules and journaled in the violation
      # journal. The graph is docs/graph under the session working directory
      # unless config.dir names another (an absolute path, or one relative to
      # that directory). Enabled after the L3 probe (scenarios glm-graph,
      # non-glm-graph, glm-graph-compact, glm-graph-goal) passed on
      # 2026-10-28.
      name: dsh-hourness/graph
      inject: [tools]
      config: {}
    - id: glm-hourness/graph-panel
      # The human's command for the project graph panel (docs/
      # ORCHESTRATION.md §2.10, §13): /graph-run starts, stops or redoes a
      # task under the invoking session's working directory (or config.dir);
      # the panel itself only reads (plain-ui). Registers nothing
      # model-facing. Enabled after the L3 probe (scenario glm-graph-panel)
      # passed on 2026-10-28.
      name: dsh-hourness/graph-panel
      inject: [commands]
      config: {}
    - id: glm-hourness/rules
      # Rules board (docs/ORCHESTRATION.md §16): the rules of each project,
      # kept in the repository (docs/rules/rules.json) and in the project's
      # .llm/rules/, and its peak mode (no effect, do less, do none; the
      # factory default is do less). The row judges every tool call after the
      # gates inside it (a rule that blocks refuses the call, a rule that
      # records leaves a line in the violation journal), keeps its own files
      # to itself (rules:files-only), gives agents the tool rules_show, and
      # gives the person /rules; the peak mode is handed to the rows that read
      # it through the glmHournessPeakMode service. A rule of the person that
      # queues refuses the call once with a waiting ticket, and the agent is
      # told when it clears. At the stop level of the peak mode a GLM
      # subagent's tool calls are one ticket for its session and its active goal
      # is paused until the peak is over; dispatching a GLM subagent waits the
      # same way. Holds no main agent and pauses none of its goals. Ships
      # enabled since the rules-loops enablement (2026-11-04): the L3 probe
      # scenarios (glm-rules, non-glm-rules, rules-queue, rules-handover,
      # rules-peak, rules-peak-hourness, rules-stop-notice, rules-peak-stop,
      # rules-peak-stop-exit) passed; the first desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md) is still owed.
      name: dsh-hourness/rules
      inject: [tools, commands]
      config: {}
    - id: glm-hourness/design
      # Main agent mode (docs/ORCHESTRATION.md §3.1, §3.5): /wish makes one
      # session per project the main agent, the person's one conversation with
      # the project. From the next step on that session's system prompt carries
      # the identity section, its tool face has no file-writing tool and no
      # ask_user_question, and its role is kept in a session projection and in
      # a holder record under the DSH user directory (one main agent per
      # project). The row's `persona` setting ({name, text}, empty by
      # default, ships no persona text) is added to the main agent's system
      # prompt only, as the section hourness:output-style. Ships enabled since
      # the m3 merge (step 12b); the L3 probe scenarios passed on the branch
      # (glm-design-wish-idle, non-glm-design-wish-idle, glm-design-main,
      # non-glm-design-main, glm-design-one-main, glm-design-persona,
      # non-glm-design-persona), the batch desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md) is still owed.
      name: dsh-hourness/design
      inject: [commands]
      config: {}
    - id: glm-hourness/execute
      # The execution line (docs/ORCHESTRATION.md §3, M7 design 0.6): dispatch_task
      # for the main agent, the dispatched chain's execution-boundary rules
      # (worker-scope, worker-graph-readonly, worker-git, worker-message-live-only;
      # dispatch-chain-readonly is the change to M3's design-before-release), the
      # tool faces of the chain, the plan and communication tools, the handback
      # processing and the review loop, the merge gate (check_commit on the
      # external check provider hourness-gate, trunk-advance-checked before and
      # after a call, the full trunk check), the drive (the holder's DSH goal from
      # a release without a command, the completion gate on update_goal complete,
      # await_human, the idle and peak stops, the reconcile after a restart, the
      # dispatch status notice), the loop-board seam (contribute, emit, runAction,
      # M7's fallback executor and watchdog) and the glmHournessExecute service.
      # Ships enabled since the M7 landing (2026-11-07): the L3 skeleton
      # scenario glm-exec-skeleton passes and the third real model run took a
      # released goal to completion with no person (M7 design 0.6 §10.3 item 2).
      # The first desktop L4 batch (design §9.2) runs on this build.
      name: dsh-hourness/execute
      inject: [tools]
      config: {}
    - id: glm-hourness/loops
      # Loop board (docs/ORCHESTRATION.md §18): what is done when something
      # happens or the time comes. Rows hand their entries, events and harness
      # actions to the service glmHournessLoops; the board validates and lists
      # them, an entry whose event nobody declares waits greyed, and the row
      # brings five entries of its own (dependency check after a merge,
      # a reminder for what waits for you too long, the end-of-day check
      # for work not committed or not pushed, the two ends of a GLM peak). It keeps the entries a person agreed to (docs/loops/ in the
      # repository, the change record in the project's .llm/loops/), gives the
      # person /loops, keeps its own files to itself (loops:files-only), and in
      # a process that has a session controller it holds the project's run
      # lock, beats every 60 seconds, reads the inbox and runs what an entry
      # says to do; entries that tell the main agent are bound to DSH schedule
      # tasks and delivered to the holder (docs/ORCHESTRATION.md §18.10);
      # script and check entries a person adopted run through the shared
      # executor (§18.9), and /loops and the loop board page of the panel list
      # every entry (§18.7). Not here yet: the tools through which a person
      # agrees to a new entry; check entries end refused (check-missing) until
      # the env row lands. Ships enabled since the
      # rules-loops enablement (2026-11-04): the L3 probe scenarios (loops,
      # loops-peak, loops-peak-restart) passed; the first desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md) is still owed.
      name: dsh-hourness/loops
      config: {}
    - id: glm-hourness/metrics
      # Metrics journal (metrics design 0.7, docs/ORCHESTRATION.md §10.6):
      # one journal per project at .llm/metrics/ (envelope plus namespace
      # body, SHA-256 chained, only harness writes). The row provides the
      # glmHournessMetrics service for the other rows' events, observes the
      # host's own seams for llm, tool, turn, approval, command and said,
      # checks yesterday and today in the background, handing the loop board
      # a daily self-check entry when it is there, and installs the code rule
      # metrics-files-only over the journal's files (and over
      # `npm run metrics -- prune`). The sibling rows' senders hand their
      # events through the service: the rules gate's rules.judged, the rules
      # command line's rules.check, the env row's daily suppression count,
      # the loop board's records (its runs.jsonl is gone). Ships enabled
      # since the metrics wiring (2026-11-04); the L3 probe scenarios
      # (metrics, non-glm-metrics, metrics-concurrent) pass on the branch,
      # and the first desktop pass (docs/DEVELOPMENT.md §3, AGENTS.md) is
      # still owed — the enablement merge closes the desktop first and
      # restarts into it (DEVELOPMENT.md §5.4).
      name: dsh-hourness/metrics
      config: {}
    - id: glm-hourness/env
      # Environment branch and scratch area (docs/ORCHESTRATION.md §7.1, §7.4;
      # M4 design §7): at an agent's first step, and again whenever the env
      # branch changes, a reminder of the project's tools (the graph's env
      # node and its tool children), the checks that run after edits, and the
      # scratch area for one-off scripts (.llm/scratch/). Before the first
      # notice for a repository it appends .llm/ to the clone's
      # .git/info/exclude and verifies with git check-ignore; once a day per
      # repository it counts suppression comments (m4-suppressions). For the
      # loop board it provides glmHournessEnv (the command of an approved
      # check line, for the board's check entries) and hands over the event
      # env.files-edited, emitted after each step that changed files
      # (m4-checks). With the loop board on, the same step runs M4's own
      # checks (the check lines with `when` of the approved tool nodes)
      # through the shared executor and hands the agent the results before
      # its next step; the board lists them as env.checks-after-edit. A
      # check held at its ceiling is a line in the main agent's environment
      # notice, and the tool check_limit (the reason it injects tools) raises
      # or resets that ceiling. Ships enabled since the m4-checks enablement
      # (2026-11-05): the L3 probe scenarios (env-notice, env-check-command,
      # env-checks, env-checks-timeout, env-checks-timeout-run,
      # env-checks-ceiling) passed; the first desktop pass
      # (docs/DEVELOPMENT.md §3, AGENTS.md, M4 design §13.4) is still owed.
      name: dsh-hourness/env
      inject: [tools]
      config: {}
    - id: glm-hourness/transcript
      # Session transcript (docs/DESIGN.md §2.4, §5.6): when a GLM compaction
      # summary is done, the glm-compact row asks this row's service
      # glmHournessTranscript to write the session's whole log as plain text
      # to <project>/.llm/transcripts/<session id>.txt (made git-ignored
      # first; not written while git still sees .llm/), and ends the summary
      # with ZCode 3.17.1's sentence pointing at that file, which the model
      # reads with Read. Each write rewrites the session's file and deletes
      # the other sessions' files not written for 14 days. config.home
      # overrides the project data directory. Ships enabled since the
      # transcript enablement (2026-11-06, the person's word): the L3 probe
      # scenario glm-compact-transcript passed, and the desktop L4 passed on
      # an isolated instance on 2026-11-06
      # (.agents/tasks/compact-recall/l4.md). Known limit: redaction goes by
      # the shape of a string, so a credential the model splits apart in its
      # own words stays in the plain-text file (docs/DESIGN.md §2.4).
      name: dsh-hourness/transcript
      config: {}
    - id: glm-hourness/bootstrap
      # Take over a project (docs/ORCHESTRATION.md §19; takeover design 0.6):
      # the command /hourness-init and the service glmHournessBootstrap. In a
      # workspace without a project graph the main agent's /hourness-init
      # scans the project read-only (git and file reads only), decides new
      # project, existing project or gaps of an existing graph, git-inits an
      # empty folder, keeps .llm/ out of git, makes <graph>/nodes/, opens a
      # takeover in .llm/bootstrap/journal.jsonl and wakes the main agent
      # with the takeover-start notice; every step of the main agent then
      # carries the takeover reminder, and once the first goal is on the
      # graph the harness proposes the three norm templates under it. Until
      # the design row's /wish calls the takeover (not merged yet, plan B8),
      # the path is an empty graph directory, /wish without words, then
      # /hourness-init in the same session. Installs no guard rule. Ships
      # enabled since the takeover enablement (2026-11-11): the L3 probe
      # scenarios (bootstrap-new, bootstrap-existing, bootstrap-trial,
      # bootstrap-gaps, bootstrap-reopen, bootstrap-resume) passed at
      # 0cc628a5 (579/579); the desktop L4 flows — /wish to the first
      # dispatch in two scratch workspaces against mockup-takeover.svg, and
      # /hourness-init status — run as batch B10 on this build, recorded
      # under .agents/tasks/bootstrap/ (docs/DEVELOPMENT.md §3, AGENTS.md).
      name: dsh-hourness/bootstrap
      inject: [commands]
      config: {}
    - id: glm-hourness/ui
      # The package's client face (dsh.client in package.json, host half
      # ./ui/index.js, bundle ./ui/client.js): the project graph tab of the
      # right sidebar. Exactly one row: client-modules counts a row named by
      # the exact package name as a source of its client face and rejects a
      # package resolved from multiple active Loader sources. Keeps the id of
      # the single-bundle UI row, which was enabled.
      name: dsh-hourness
      config: {}
