<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1640" viewBox="0 0 560 1640">
  <style>
    text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#ececf1}
    .cap{font-size:12px;fill:#8a8a92}
    .capb{font-size:13px;font-weight:700;fill:#b5b5bb}
    .lab{font-size:11px;font-weight:700;fill:#8a8a92;letter-spacing:.5px}
    .h1{font-size:15.5px;font-weight:700}
    .t{font-size:13.5px}
    .tb{font-size:14px;font-weight:700}
    .cx{font-size:13px}
    .bg{font-size:12.5px;fill:#c8c8ce}
    .th{font-size:11.5px;font-weight:700;fill:#8a8a92}
    .ob{font-size:13px;font-weight:700}
    .s{font-size:12.5px;fill:#b5b5bb}
    .m{font-size:12px;fill:#8a8a92}
    .a{font-size:12.5px;fill:#6aa1ff}
    .n{font-size:12px;fill:#8a8a92;font-variant-numeric:tabular-nums}
  </style>
  <rect width="560" height="1640" fill="#111113"/>
  <text class="capb" x="20" y="24">首页：一眼看懂（右侧栏「项目图」页签的正文）</text>
  <text class="cap" x="20" y="44">按 2026-10-29T14:20Z 的真实图与 design.md 0.4 的规则算出，标题按 §4.5 改写；普通会话，上次看是 12:20Z。</text>

  <rect x="20" y="60" width="520" height="1540" rx="12" fill="#161618" stroke="#2c2c31"/>

  <!-- 效果是 -->
  <text class="lab" x="40" y="92">效果是</text>
  <circle cx="486" cy="88" r="3.5" fill="#3fb950"/>
  <text class="m" x="494" y="92">实时</text>
  <text class="h1" x="40" y="120">GLM 在 DSH 里跟在 ZCode 里一样好用</text>
  <text class="a" x="520" y="120" text-anchor="end">讲细点</text>
  <rect x="40" y="134" width="330" height="6" rx="3" fill="#3fb950"/>
  <text class="n" x="380" y="141">21 / 21</text>
  <text class="s" x="40" y="164">做完 21 件，没有剩下的；还开着的：「GLM 的通道与 ZCode 方言」</text>
  <text class="h1" x="40" y="198">AI 按规矩推进项目，你只管要什么和拍板</text>
  <text class="a" x="520" y="198" text-anchor="end">讲细点</text>
  <rect x="40" y="212" width="330" height="6" rx="3" fill="#2c2c31"/>
  <rect x="40" y="212" width="156" height="6" rx="3" fill="#3fb950"/>
  <text class="n" x="380" y="219">18 / 38</text>
  <text class="s" x="40" y="242">做完 18 件，还剩 20 件；其中 1 块还没细分成小步</text>
  <line x1="40" y1="258" x2="520" y2="258" stroke="#2c2c31"/>

  <!-- 要你定的 -->
  <text class="lab" x="40" y="284">要你定的 · 3</text>

  <!-- 卡 1：先想后看（从默认的整张表起步） -->
  <rect x="40" y="294" width="480" height="404" rx="10" fill="#1f1f23" stroke="#4a2b2b"/>
  <rect x="40" y="302" width="3" height="388" fill="#f85149"/>
  <text class="tb" x="56" y="322">派活与合并的十件事，怎样算做完</text>
  <text class="bg" x="56" y="346">这一块是让几个 agent 分头干活、再把结果合进主干。</text>
  <text class="bg" x="56" y="364">方案已经写好，拆成十件事，每件都要写清怎样算做完。</text>
  <text class="bg" x="56" y="382">写进去以后再改要你出手，所以先问你。</text>
  <text class="m" x="56" y="406">这次先不告诉你 agent 推荐哪个：最近 10 次里你有 9 次选了推荐。</text>
  <text class="m" x="56" y="424">先按你自己的想法选；这次选项用数字标号，选完就能看到结论和推荐。</text>
  <text class="m" x="56" y="446">这件事以后改起来很贵，多看一眼</text>
  <text class="cx" x="56" y="470">取决于：你对「合进主干后自动推送」和「练习题只用来查</text>
  <text class="cx" x="56" y="488">有没有改坏」这两条有保留吗？</text>
  <text class="th" x="60" y="518">选项</text>
  <text class="th" x="100" y="518">怎么做</text>
  <text class="th" x="214" y="518">得到</text>
  <text class="th" x="362" y="518">代价</text>
  <line x1="56" y1="526" x2="504" y2="526" stroke="#2c2c31"/>
  <circle cx="66" cy="542" r="6" fill="none" stroke="#8a8a92" stroke-width="1.3"/>
  <text class="cx" x="78" y="546">1</text>
  <text class="ob" x="100" y="546">按设计原样写入</text>
  <text class="s" x="214" y="546">马上按设计开工</text>
  <text class="s" x="362" y="546">哪条不合适，要你</text>
  <text class="s" x="362" y="564">在面板上改</text>
  <line x1="56" y1="576" x2="504" y2="576" stroke="#26262b"/>
  <circle cx="66" cy="592" r="6" fill="none" stroke="#8a8a92" stroke-width="1.3"/>
  <text class="cx" x="78" y="596">2</text>
  <text class="ob" x="100" y="596">你逐条改写</text>
  <text class="s" x="214" y="596">十条都按你的原话写</text>
  <text class="s" x="362" y="596">要读十行并改写；第一</text>
  <text class="s" x="362" y="614">个能跑的版本晚一轮开工</text>
  <line x1="56" y1="626" x2="504" y2="626" stroke="#2c2c31"/>
  <rect x="56" y="636" width="88" height="28" rx="7" fill="none" stroke="#3a3a40"/>
  <text class="cx" x="100" y="655" text-anchor="middle" style="fill:#8a8a92">批准所选</text>
  <text class="cx" x="160" y="655">都不要</text>
  <text class="cx" x="216" y="655">补充</text>
  <text class="a" x="256" y="655">看推荐</text>
  <text class="a" x="504" y="655" text-anchor="end">讲细点</text>
  <text class="m" x="56" y="684">结论行和推荐先收起来了：选一项或点「看推荐」就出现，用的也是数字。</text>

  <!-- 卡 2：等你批准的提议 -->
  <rect x="40" y="710" width="480" height="132" rx="10" fill="#1f1f23" stroke="#2c2c31"/>
  <text class="tb" x="56" y="738">合入主干前必须全部通过的命令</text>
  <text class="s" x="56" y="760">等你批准 · agent 提的</text>
  <text class="t" x="56" y="784">每次合入前自动跑构建、检查、测试和探针，全过才合进主干</text>
  <rect x="56" y="800" width="56" height="28" rx="7" fill="#2b3b55" stroke="#3d5a85"/>
  <text class="cx" x="84" y="819" text-anchor="middle">批准</text>
  <text class="cx" x="128" y="819">拒绝</text>
  <text class="cx" x="172" y="819">补充</text>
  <text class="a" x="504" y="819" text-anchor="end">讲细点 · 7 条命令</text>

  <text class="a" x="40" y="868">还有 1 件 · 讲细点</text>
  <text class="m" x="40" y="890">第一张是先想后看，从整张表起步；平时首页的卡从说重点起步（题目、背景、取决于、</text>
  <text class="m" x="40" y="906">选项与怎么做、结论行）。它是 question-37，假设已迁到表格字段并补了背景；</text>
  <text class="m" x="40" y="922">第二张是 norm-merge-gate；「还有 1 件」是 question-38。</text>
  <line x1="40" y1="938" x2="520" y2="938" stroke="#2c2c31"/>

  <!-- 现在 -->
  <text class="lab" x="40" y="964">现在</text>
  <circle cx="46" cy="984" r="3.5" fill="#8a8a92"/>
  <text class="t" x="60" y="989">这个会话里没有 agent 在跑；在做的 15 件可能在别的会话</text>
  <text class="t" x="60" y="1009">或 DSH 之外推进 · <tspan class="a" style="font-size:13.5px">输入 /wish 让它接手</tspan></text>
  <text class="a" x="520" y="1009" text-anchor="end">讲细点</text>
  <line x1="40" y1="1026" x2="520" y2="1026" stroke="#2c2c31"/>

  <!-- 怎么做 -->
  <text class="lab" x="40" y="1052">怎么做 · 接下来</text>
  <text class="n" x="44" y="1081">1</text>
  <text class="t" x="64" y="1081">经验：踩过的坑和解法，子 agent 不用再摸一遍</text>
  <circle cx="68" cy="1099" r="3" fill="#d29922"/>
  <text class="s" x="76" y="1103">在做 · 1 分钟前有进展</text>
  <line x1="64" y1="1116" x2="520" y2="1116" stroke="#26262b"/>
  <text class="n" x="44" y="1137">2</text>
  <text class="t" x="64" y="1137">看得见花了多少额度，高峰时段省着用</text>
  <circle cx="68" cy="1155" r="3" fill="#d29922"/>
  <text class="s" x="76" y="1159">在做 · 8 分钟前有进展</text>
  <line x1="64" y1="1172" x2="520" y2="1172" stroke="#26262b"/>
  <text class="n" x="44" y="1193">3</text>
  <text class="t" x="64" y="1193">规则：你定下的规矩，agent 每一步都照做</text>
  <circle cx="68" cy="1211" r="3" fill="#d29922"/>
  <text class="s" x="76" y="1215">在做 · 8 分钟前有进展</text>
  <text class="a" x="40" y="1244">讲细点 · 全部 20 件</text>
  <line x1="40" y1="1262" x2="520" y2="1262" stroke="#2c2c31"/>

  <!-- 上次看之后 -->
  <text class="lab" x="40" y="1288">上次看之后 · 2 小时前</text>
  <circle cx="46" cy="1309" r="2" fill="#8a8a92"/>
  <text class="s" x="56" y="1313">「经验：踩过的坑和解法，子 agent 不用再摸一遍」等 2 件</text>
  <text class="s" x="56" y="1331">有新进展</text>
  <circle cx="46" cy="1351" r="2" fill="#8a8a92"/>
  <text class="s" x="56" y="1355">「看得见花了多少额度，高峰时段省着用」等 5 件有新进展</text>
  <circle cx="46" cy="1375" r="2" fill="#8a8a92"/>
  <text class="s" x="56" y="1379">按你在对话里说的定下：「访谈里让你选的题由系统出卡，</text>
  <text class="s" x="56" y="1397">推荐放最后」</text>
  <circle cx="46" cy="1417" r="2" fill="#8a8a92"/>
  <text class="s" x="56" y="1421">不做「每个推荐配一行反方：为什么可能选另一个」了</text>
  <circle cx="46" cy="1441" r="2" fill="#8a8a92"/>
  <text class="s" x="56" y="1445">做完了「选项卡的统一格式：加粗一眼看懂，按三问四答</text>
  <text class="s" x="56" y="1463">五键组织」</text>
  <text class="a" x="40" y="1492">讲细点 · 还有 16 处变化</text>
  <text class="m" x="40" y="1514">已关闭的事照原标题（§4.5 C 只改开着的）；同一种变化 5 分钟内的合成一行。</text>
  <line x1="40" y1="1530" x2="520" y2="1530" stroke="#2c2c31"/>

  <!-- footer -->
  <text class="s" x="40" y="1556">规则 ›</text>
  <text class="s" x="96" y="1556">经验 ›</text>
  <text class="s" x="152" y="1556">整张图 ›</text>
  <text class="s" x="222" y="1556">上手说明 ›</text>
  <text class="m" x="40" y="1582">「规则」「经验」在对应板块装上之前不显示，都是第 2 层的页。</text>
</svg>
