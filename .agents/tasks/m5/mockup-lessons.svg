<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1010" viewBox="0 0 800 1010">
  <style>
    text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#ececf1}
    .cap{font-size:12px;fill:#8a8a92}
    .capb{font-size:13px;font-weight:700;fill:#b5b5bb}
    .lab{font-size:11px;font-weight:700;fill:#8a8a92;letter-spacing:.5px}
    .h1{font-size:15px;font-weight:700}
    .t{font-size:13px}
    .s{font-size:12px;fill:#b5b5bb}
    .m{font-size:11.5px;fill:#8a8a92}
    .a{font-size:11.5px;fill:#6aa1ff}
    .tag{fill:none;stroke:#3a3a40}
    .rule{stroke:#26262b}
  </style>
  <rect width="800" height="1010" fill="#111113"/>
  <text class="capb" x="20" y="24">项目「相册整理」：打开右侧栏的项目图，首页页脚点「经验 ›」，看到下面这一页</text>
  <text class="cap" x="20" y="44">页面只看不点，没有按钮、开关和表单；每条下面一行写怎么改。条目内容是示意，经验条文是英文（写给模型看的），页面照原文显示。</text>

  <rect x="20" y="60" width="760" height="930" rx="12" fill="#161618" stroke="#2c2c31"/>
  <rect x="36" y="74" width="84" height="26" rx="7" fill="none" stroke="#3a3a40"/>
  <text class="t" x="78" y="92" text-anchor="middle">‹ 首页</text>
  <text class="h1" x="40" y="128">经验</text>
  <text class="m" x="84" y="128">这个项目踩过的坑和解法，以及 agent 记住的事</text>
  <line x1="36" y1="142" x2="764" y2="142" stroke="#2c2c31"/>

  <text class="t" x="40" y="168">本项目 12 条经验 · 2 条候选等主 Agent 合并</text>
  <line x1="36" y1="184" x2="764" y2="184" stroke="#2c2c31"/>

  <text class="t" x="40" y="210">resize-all opens every source file at once and fails on large folders</text>
  <text class="s" x="40" y="230">解法：run it with --chunk 200, then count the outputs: skipped files still report success</text>
  <text class="s" x="40" y="250">3 天前确认 · 28 天里 2 个会话碰到</text>
  <rect class="tag" x="40" y="262" width="132" height="22" rx="11"/>
  <text class="m" x="106" y="277" text-anchor="middle">命令 resize-all</text>
  <rect class="tag" x="180" y="262" width="184" height="22" rx="11"/>
  <text class="m" x="272" y="277" text-anchor="middle">报错 Too many open files</text>
  <text class="m" x="40" y="304">证据</text>
  <text class="a" x="78" y="304">提交 3f9a2c1</text>
  <text class="a" x="168" y="304">节点 task-3</text>
  <text class="m" x="40" y="324">来自 task-3 的交回，主 Agent 合并的</text>
  <text class="m" x="40" y="342">要改：跟主 Agent 说「删掉经验 L-3f9a2c」，或在输入框打 /lessons delete L-3f9a2c</text>
  <line x1="40" y1="358" x2="760" y2="358" class="rule"/>

  <text class="t" x="40" y="382">Date-based renames collide when two photos share the same second</text>
  <text class="s" x="40" y="402">解法：append a counter suffix to the date pattern and check for duplicates before renaming</text>
  <text class="s" x="40" y="422">9 天前确认 · 28 天里 1 个会话碰到</text>
  <text class="m" x="40" y="442">情况、证据、来源的写法同上</text>
  <text class="m" x="40" y="460">要改：跟主 Agent 说「删掉经验 L-7be410」，或在输入框打 /lessons delete L-7be410</text>
  <line x1="36" y1="476" x2="764" y2="476" stroke="#2c2c31"/>

  <text class="s" x="40" y="500">▸ agent 收起的（1）　　▸ 你删掉的（0）</text>
  <text class="m" x="40" y="520">默认折起；展开的每条末行写怎么找回来</text>
  <line x1="36" y1="536" x2="764" y2="536" stroke="#2c2c31"/>

  <text class="lab" x="40" y="562">关于你 · 所有项目共用</text>
  <text class="t" x="40" y="586">先说结论，别堆术语</text>
  <text class="s" x="40" y="606">偏好 · 你的原话「先说结论，别堆术语」· 10 月 29 日 · 不会淡忘，只有你能撤</text>
  <text class="m" x="40" y="626">要改：跟主 Agent 说「忘掉 answer-first」，或在输入框打 /memory forget answer-first</text>
  <line x1="40" y1="642" x2="760" y2="642" class="rule"/>
  <text class="t" x="40" y="666">汇报细度：简洁</text>
  <text class="s" x="40" y="686">你 10 月 29 日说过「太长了」，下一个会话的汇报按这一档</text>
  <text class="m" x="40" y="706">要改：跟主 Agent 说「汇报细度恢复默认」</text>
  <line x1="36" y1="722" x2="764" y2="722" stroke="#2c2c31"/>

  <text class="lab" x="40" y="748">agent 推测的（会淡忘）</text>
  <text class="t" x="40" y="772">重命名时倾向保留拍摄日期</text>
  <text class="s" x="40" y="792">还记得七成 · 14 天不用就淡掉一半 · 你说一句「忘掉」就撤</text>
  <text class="m" x="40" y="812">要改：跟主 Agent 说「忘掉 keep-shot-date」，或在输入框打 /memory forget keep-shot-date</text>
  <line x1="36" y1="828" x2="764" y2="828" stroke="#2c2c31"/>

  <text class="lab" x="40" y="854">项目里的线索 · 只在本项目</text>
  <text class="t" x="40" y="878">原图放在 originals/ 下，处理时不覆盖</text>
  <text class="s" x="40" y="898">出处</text>
  <text class="a" x="68" y="898">节点 task-2</text>
  <text class="s" x="156" y="898">· 还记得九成</text>
  <text class="m" x="40" y="918">要改：跟主 Agent 说「忘掉 keep-originals」，或在输入框打 /memory forget keep-originals</text>
  <text class="m" x="40" y="944">从旧记忆文件迁来的条目标「没有出处」</text>
  <text class="m" x="40" y="970">记录文件有新内容后 15 秒内页面更新</text>
</svg>
